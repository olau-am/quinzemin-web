name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[prepare,api,viz,dev]"
      # Los tests que necesitan los datos locales de València (marca "data") se saltan en CI
      - run: pytest -m "not data and not slow"
